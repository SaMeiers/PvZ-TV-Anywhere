plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    Runtime.getRuntime().exec(new String[]{
            "keytool", "-genkeypair",
            "-v", "-keystore", "${System.getProperty("user.home")}/debug.keystore",
            "-storepass", "android",
            "-keypass", "android",
            "-alias", "androiddebugkey",
            "-keyalg", "RSA",
            "-keysize", "2048",
            "-validity", "10000",
            "-dname", "CN=Android Debug,O=Android,C=US"
    }).waitFor()
}

android {
    namespace = "com.trans.pvztv"
    ndkVersion = "27.3.13750724"
    compileSdk = 34

    defaultConfig {
        def gitBranch = "git rev-parse --abbrev-ref HEAD".execute().text.trim()
        def gitCommitDate = "git log --date=format:%y%m%d --pretty=format:%cd -1".execute().text.trim()
        def gitCommitHash = "git rev-parse --short HEAD".execute().text.trim()
        def gitCommitNum = "git rev-list --count HEAD".execute().text.trim()
        def gitRepoUrl = "git config --get remote.origin.url".execute().text.trim()

        applicationId = "com.trans.pvztv"
        minSdk = 21
        targetSdk = 33
        versionCode = 2
        versionName = "0.0.0"
        versionNameSuffix = "-" + gitCommitDate

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // Devices with 16 KB pages (Android 15+) cannot map a library
                // whose LOAD segments are only 4 KB aligned, which is what the
                // r27 linker still produces by default.
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }

        buildConfigField("String", "GIT_BRANCH", "\"${gitBranch}\"")
        buildConfigField("String", "GIT_COMMIT_HASH", "\"${gitCommitHash}\"")
        buildConfigField("int", "GIT_COMMIT_NUM", gitCommitNum)
        buildConfigField("String", "GIT_REPO_URL", "\"${gitRepoUrl}\"")
    }

    signingConfigs {
        // 本文件已被 git 跟踪, 不要在此处修改签名配置, 需要自定义签名配置请参考 README.md
        release {
            keyAlias = keystoreProperties.getProperty("keyAlias", "androiddebugkey")
            keyPassword = keystoreProperties.getProperty("keyPassword", "android")
            storeFile = file(keystoreProperties.getProperty("storeFile", "${System.getProperty("user.home")}/debug.keystore"))
            storePassword = keystoreProperties.getProperty("storePassword", "android")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
        }

        // The diagnostic build: same game, but it traces every call the guest
        // makes into the host and keeps the hang watchdog running. Installs
        // next to the normal one thanks to the id suffix, so a crash can be
        // reproduced without uninstalling anything.
        relWithDebInfo {
            applicationIdSuffix = ".debug"
            signingConfig = signingConfigs.debug
            debuggable = true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo", "-DPVZTV_DIAGNOSTICS=ON"
                }
            }
        }

        release {
            signingConfig = signingConfigs.release
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
            /* Uncommenting will cause a crash. */
            // minifyEnabled = true
            // shrinkResources = true
        }
    }

    flavorDimensions += "version"

    productFlavors {
        // w 代替 v 以降低默认优先级
        register("w111") {
            dimension = "version"
            applicationId = "com.trans.pvz"
            versionName = "1.1.1"
            externalNativeBuild {
                cmake {
                    arguments "-DPVZ_VERSION=111"
                }
            }
        }

        register("v115") {
            dimension = "version"
            versionName = "1.1.5"
            externalNativeBuild {
                cmake {
                    arguments "-DPVZ_VERSION=115"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "PvZ-TV-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation fileTree("dir": "libs", "include": ["*.jar"])
    implementation 'androidx.annotation:annotation:1.9.1'
}

// The game's assets are not in this repository. If you have a packaged build of
// the game, point `pvztvBaseApk` at it (in gradle.properties or with
// -PpvztvBaseApk=<path>) and its assets are unpacked into src/main/assets once.
tasks.register("ensureAssets") {
    doLast {
        def assetsDir = file("src/main/assets")
        if (assetsDir.exists() && assetsDir.list().length > 0) return

        def apkPath = project.findProperty("pvztvBaseApk")
        if (apkPath == null) {
            logger.lifecycle("No assets in ${assetsDir}; set -PpvztvBaseApk=<apk> to unpack them from a packaged build.")
            return
        }
        def baseApk = file(apkPath)
        if (!baseApk.exists()) {
            logger.warn("pvztvBaseApk not found: ${baseApk.absolutePath}")
            return
        }
        logger.lifecycle("Extracting assets from ${baseApk.name}...")
        copy {
            from zipTree(baseApk)
            into "src/main"
            include "assets/**"
        }
    }
}

preBuild.dependsOn "ensureAssets"

