name: Desktop CI

on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # glad generates its loader at configure time with a Python template engine.
      - name: Install glad dependencies
        run: python -m pip install --disable-pip-version-check jinja2

      # SDL needs these to build its X11/Wayland video backends.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev

      # CMake must use the interpreter jinja2 was installed into, not whichever
      # Python it happens to find first.
      - name: Configure
        run: >
          cmake -S desktop -B build/desktop
          -DCMAKE_BUILD_TYPE=Release
          -DPython_EXECUTABLE=${{ steps.python.outputs.python-path }}

      - name: Build
        run: cmake --build build/desktop --config Release --target pvztv_player --parallel
