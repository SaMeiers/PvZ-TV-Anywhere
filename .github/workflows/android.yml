name: Android CI

on:
  push:
    paths-ignore:
      - '**.md'

  pull_request:
    paths-ignore:
      - '**.md'

  # So a build can be kicked off by hand from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ w111, v115 ]
        build_type: [ release ]
        # Chinese is the game as it ships. English swaps the bitmap fonts and
        # the two string files; everything else is the same data, so the
        # assets repository stores it once (see its README).
        language: [ zh, en ]
        # The diagnostic build: traces every guest call and keeps the hang
        # watchdog running. Installs next to the normal app (id suffix .debug).
        include:
          - version: v115
            build_type: relWithDebInfo
            language: en

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only the runner's JIT is needed here; SDL/zlib/glad are for the desktop
      # build, and SDL ships a Gradle wrapper that would trip wrapper validation.
      - name: Check out the dynarmic submodule
        run: git submodule update --init --recursive third_party/dynarmic

      - name: Check out the assets
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.ASSETS_REPO }}
          path: assets-src
          token: ${{ secrets.ASSETS_TOKEN }}
        continue-on-error: true

      # Without those secrets nothing is checked out and the build simply comes
      # out with no game data, which is what a fork gets.
      - name: Put the assets in place
        run: |
          if [ ! -d assets-src/assets ]; then
            echo "No assets available; building without game data."
            exit 0
          fi
          mkdir -p app/src/main/assets
          cp -r assets-src/assets/. app/src/main/assets/
          if [ "${{ matrix.language }}" = "en" ]; then
            cp -r assets-src/overrides/english/. app/src/main/assets/
          fi
          echo "$(find app/src/main/assets -type f | wc -l) asset files in place (${{ matrix.language }})"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure

      - name: Decode keystore
        env:
          KEYSTORE_ENCODED: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_ENCODED" ]; then
            echo "$KEYSTORE_ENCODED" | base64 -d > app/keystore.jks
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          elif [ ! -f "$HOME/debug.keystore" ]; then
            # No secret (a fork, say): the debug signing config still needs a
            # key, and the diagnostic build is signed with it.
            keytool -genkeypair -dname "CN=PvZ TV CI" -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -keyalg RSA -validity 10000
          fi

      - name: Build with Gradle
        id: build
        run: |
          version="${{ matrix.version }}"
          build_type="${{ matrix.build_type }}"
          chmod +x gradlew
          ./gradlew assemble${version^}${build_type^}
          # The language goes in the file name so the builds do not collide.
          out="app/build/outputs/apk/$version/$build_type"
          for apk in "$out"/*.apk; do
            mv "$apk" "${apk%.apk}-${{ matrix.language }}.apk"
          done
          echo "path=$out/*.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PvZ-TV-${{ matrix.version }}-${{ matrix.build_type }}-${{ matrix.language }}
          path: ${{ steps.build.outputs.path }}

  release:
    needs: [ build ]
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      && github.repository_owner == 'SaMeiers'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit information
        id: commit_info
        run: |
          echo "commits_date=$(git log --date=format:%y%m%d --pretty=format:'%cd' -1)" >> "$GITHUB_OUTPUT"
          echo "commits_count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log --pretty=format:'%s' -1)" >> "$GITHUB_OUTPUT"

      # Both languages of the v115 release build; the diagnostic and w111
      # ones stay as CI artifacts.
      - name: Download the APKs
        uses: actions/download-artifact@v8
        with:
          pattern: PvZ-TV-v115-release-*
          merge-multiple: true
          path: artifact

      - name: Publish pre-release
        if: github.ref == 'refs/heads/main'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: nightly
          title: Nightly Build
          files: artifact/*.apk

      # Upstream publishes stable builds to a separate PvZ-TV-builds repository;
      # here they live in this one, so no extra token is needed.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          make_latest: true
          tag_name: ${{ steps.commit_info.outputs.commits_date }}-${{ steps.commit_info.outputs.commits_count }}
          body: ${{ steps.commit_info.outputs.commit_msg }} (${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          files: artifact/*.apk

      # A tagged version gets everything in one place: these APKs plus the PC
      # bundles the desktop workflow attaches to the same release.
      - name: Attach the APKs to the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifact/*.apk
